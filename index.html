<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSCDA — Digital Operating System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  /* ===== design tokens ===== */
  --bg-0:#0A0B0E;
  --bg-1:#101218;
  --bg-2:#15171F;
  --ink:#EEEFF3;
  --ink-dim:#9BA1AF;
  --ink-faint:#666C7A;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);

  --glass1-bg:rgba(255,255,255,.035); --glass1-bd:rgba(255,255,255,.08);
  --glass2-bg:rgba(255,255,255,.055); --glass2-bd:rgba(255,255,255,.12);
  --glass3-bg:rgba(255,255,255,.085); --glass3-bd:rgba(255,255,255,.20);
  --glass4-bg:rgba(14,15,20,.88);     --glass4-bd:rgba(255,255,255,.16);

  --accent:#C9A461;
  --accent-soft:rgba(201,164,97,.14);
  --accent-line:rgba(201,164,97,.35);
  --accent-ink:#1B1607;
  --steel:#8AA3CC;
  --steel-soft:rgba(138,163,204,.14);

  --success:#5BAE86; --success-soft:rgba(91,174,134,.14);
  --warning:#D9A441; --warning-soft:rgba(217,164,65,.14);
  --critical:#D9705C; --critical-soft:rgba(217,112,92,.14);

  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:64px;

  --font-display:'Fraunces', serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;

  --ease:cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(201,164,97,.09), transparent 60%),
    radial-gradient(900px 620px at 88% 8%, rgba(138,163,204,.08), transparent 55%),
    radial-gradient(1200px 800px at 50% 110%, rgba(120,130,160,.05), transparent 60%),
    var(--bg-0);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--ink);}
a{color:inherit;}
button{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ===================== SHELL (NO SIDEBAR) ===================== */
.canvas{max-width:1520px; margin:0 auto; padding:0 32px;}
@media (max-width:900px){ .canvas{padding:0 16px;} }

.header-wrap{position:sticky; top:0; z-index:40; padding:14px 32px 0;}
@media (max-width:900px){ .header-wrap{padding:10px 16px 0;} }
.header{
  max-width:1520px; margin:0 auto;
  display:flex; align-items:center; gap:18px;
  background:var(--glass2-bg); border:1px solid var(--glass2-bd);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  border-radius:16px; padding:12px 16px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer; flex-shrink:0;}
.brand .mark{
  width:38px; height:38px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(155deg, var(--accent), #8f7238);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--accent-ink);
  box-shadow:0 4px 14px rgba(201,164,97,.25);
}
.brand .word{line-height:1.15;}
.brand .word b{font-family:var(--font-display); font-weight:600; font-size:16.5px; letter-spacing:.01em; display:block;}
.brand .word span{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase;}

.h-search{
  flex:1; display:flex; align-items:center; gap:9px;
  background:rgba(255,255,255,.03); border:1px solid var(--line);
  border-radius:10px; padding:9px 13px; cursor:pointer; min-width:0;
  transition:border-color .18s var(--ease), background .18s var(--ease);
}
.h-search:hover{border-color:var(--line-strong); background:rgba(255,255,255,.05);}
.h-search svg{flex-shrink:0; opacity:.55;}
.h-search .ph{color:var(--ink-faint); font-size:13.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.h-search kbd{
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);
  border:1px solid var(--line); border-radius:5px; padding:2px 6px; flex-shrink:0;
}
@media (max-width:720px){ .h-search .ph{display:none;} .h-search kbd{display:none;} .h-search{flex:0 0 auto; padding:9px;} }

.h-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.h-icon-btn{
  width:36px; height:36px; border-radius:9px; border:1px solid transparent; background:transparent;
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:all .16s var(--ease); position:relative;
}
.h-icon-btn:hover{background:rgba(255,255,255,.06); border-color:var(--line); color:var(--ink);}
.h-dot{position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--bg-1);}

.h-profile{
  display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border-radius:10px;
  border:1px solid var(--line); background:rgba(255,255,255,.03); cursor:pointer;
  transition:all .16s var(--ease);
}
.h-profile:hover{border-color:var(--line-strong); background:rgba(255,255,255,.06);}
.h-profile .av{width:26px; height:26px; border-radius:50%; background:var(--steel-soft); border:1px solid var(--steel); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:600; color:var(--steel); font-family:var(--font-mono);}
.h-profile .role{font-size:12.5px; font-weight:600;}
.h-profile .role small{display:block; font-size:9.5px; color:var(--ink-faint); font-weight:500; font-family:var(--font-mono); letter-spacing:.06em; text-transform:uppercase;}
@media (max-width:600px){ .h-profile .role{display:none;} }

/* dropdown panel (profile / notifications) */
.pop{
  position:absolute; top:calc(100% + 8px); right:0; width:280px; z-index:60;
  background:var(--glass4-bg); border:1px solid var(--glass4-bd);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-radius:14px; padding:8px; box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation:pop-in .16s var(--ease);
}
@keyframes pop-in{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
.pop-label{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); padding:9px 10px 5px;}
.pop-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 10px; border-radius:8px; font-size:13px; cursor:pointer; color:var(--ink-dim);
}
.pop-item:hover{background:rgba(255,255,255,.06); color:var(--ink);}
.pop-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.pop-item .tag{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint);}
.pop-divider{height:1px; background:var(--line); margin:6px 4px;}
.rel{position:relative;}

/* ===================== MAIN LAYOUT ===================== */
.main{padding:26px 0 90px;}

.crumbs{display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:12.5px; color:var(--ink-faint); margin-bottom:18px; font-family:var(--font-mono);}
.crumbs .cr-link{cursor:pointer; color:var(--ink-dim); transition:color .15s;}
.crumbs .cr-link:hover{color:var(--accent);}
.crumbs .cr-sep{opacity:.4;}
.crumbs .cr-current{color:var(--ink);}
.back-btn{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-dim);
  cursor:pointer; margin-bottom:14px; font-family:var(--font-mono); letter-spacing:.02em;
  transition:color .15s;
}
.back-btn:hover{color:var(--accent);}

/* ===================== HERO ===================== */
.hero{padding:26px 0 8px; text-align:center;}
.hero .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:14px;}
.hero h1{font-family:var(--font-display); font-weight:600; font-size:clamp(34px,5vw,54px); margin:0 0 10px; letter-spacing:-.01em;}
.hero p{color:var(--ink-dim); font-size:15.5px; max-width:520px; margin:0 auto 30px;}

/* ===================== SECTIONS ===================== */
.section{margin-top:var(--sp-6);}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:16px; flex-wrap:wrap;}
.section-head .st{font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint);}
.section-head .sd{font-size:13px; color:var(--ink-faint); margin-top:3px;}
.section-head h2{font-family:var(--font-display); font-weight:600; font-size:22px; margin:2px 0 0;}

/* ===================== BUSINESS AREA CARDS (large) ===================== */
.areas-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
@media (max-width:820px){ .areas-grid{grid-template-columns:1fr;} }

.area-card{
  position:relative; overflow:hidden;
  background:var(--glass2-bg); border:1px solid var(--glass2-bd);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:var(--r-xl); padding:30px 28px 26px; cursor:pointer;
  transition:border-color .2s var(--ease), transform .2s var(--ease), background .2s var(--ease);
  display:flex; flex-direction:column; min-height:200px;
}
.area-card:hover{border-color:var(--accent-line); transform:translateY(-3px); background:var(--glass3-bg);}
.area-card .glow{position:absolute; width:260px; height:260px; border-radius:50%; top:-120px; right:-80px; background:radial-gradient(circle, rgba(201,164,97,.18), transparent 70%); pointer-events:none;}
.area-card .ic{width:44px; height:44px; border-radius:11px; background:var(--accent-soft); border:1px solid var(--accent-line); display:flex; align-items:center; justify-content:center; margin-bottom:18px; color:var(--accent);}
.area-card h3{font-family:var(--font-display); font-size:25px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em;}
.area-card .desc{color:var(--ink-dim); font-size:13.5px; margin:0 0 20px; flex:1;}
.area-card .stats{display:flex; gap:18px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); margin-bottom:16px;}
.area-card .stats b{color:var(--ink); font-weight:600;}
.area-card .explore{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--accent); font-family:var(--font-mono); letter-spacing:.04em;}
.area-card .explore svg{transition:transform .2s var(--ease);}
.area-card:hover .explore svg{transform:translateX(3px);}

/* ===================== FUNCTION CARDS (medium) ===================== */
.fn-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media (max-width:820px){ .fn-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ .fn-grid{grid-template-columns:1fr;} }
.fn-card{
  background:var(--glass1-bg); border:1px solid var(--glass1-bd);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:var(--r-lg); padding:22px 20px; cursor:pointer;
  transition:all .18s var(--ease);
}
.fn-card:hover{border-color:var(--steel); background:var(--glass2-bg); transform:translateY(-2px);}
.fn-card .ic{width:34px; height:34px; border-radius:9px; background:var(--steel-soft); border:1px solid rgba(138,163,204,.3); display:flex; align-items:center; justify-content:center; margin-bottom:14px; color:var(--steel);}
.fn-card h4{font-size:16px; font-weight:600; margin:0 0 4px;}
.fn-card .cnt{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:14px;}
.fn-card .explore{font-size:12px; font-weight:600; color:var(--ink-dim); font-family:var(--font-mono); display:flex; align-items:center; gap:5px;}
.fn-card:hover .explore{color:var(--steel);}

/* ===================== CIRCLE NODES ===================== */
.circle-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
@media (max-width:820px){ .circle-grid{grid-template-columns:1fr;} }
.circle-node{
  background:var(--glass2-bg); border:1px solid var(--glass2-bd);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-radius:var(--r-lg); padding:22px 22px 20px; cursor:pointer;
  transition:all .18s var(--ease); display:flex; flex-direction:column; gap:10px;
}
.circle-node:hover{border-color:var(--accent-line); transform:translateY(-2px);}
.circle-node .top{display:flex; align-items:center; justify-content:space-between;}
.circle-node .name{display:flex; align-items:center; gap:9px; font-size:16.5px; font-weight:600;}
.circle-node .name .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex-shrink:0;}
.circle-node .q{color:var(--ink-dim); font-size:13px; line-height:1.5;}
.circle-node .foot{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.circle-node .cnt{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);}
.circle-node .arrow{color:var(--accent); display:flex; transition:transform .18s var(--ease);}
.circle-node:hover .arrow{transform:translateX(3px);}
.circle-node.empty{opacity:.55;}
.circle-node.empty:hover{opacity:.85;}

/* journey strip */
.journey{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:34px;}
.journey .jnode{
  background:var(--glass1-bg); border:1px solid var(--glass1-bd); border-radius:10px;
  padding:10px 16px; font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-dim);
}
.journey .jarrow{color:var(--ink-faint); font-size:13px;}

/* ===================== BUSINESS FLOW (Polymer / Textile circular nav) ===================== */
.flow-wrap{overflow-x:auto; overflow-y:hidden; padding:6px 2px 14px; -webkit-overflow-scrolling:touch;}
.flow-row{display:flex; align-items:center; gap:0; min-width:max-content; margin:0 auto;}
@media (min-width:860px){ .flow-row{justify-content:center; min-width:0;} }
.flow-item{display:flex; flex-direction:column; align-items:center; gap:10px; flex-shrink:0; width:136px;}
.flow-circle{
  width:96px; height:96px; border-radius:50%; flex-shrink:0;
  background:var(--glass2-bg); border:1.5px solid var(--glass2-bd);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); cursor:pointer; position:relative;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
}
.flow-circle:hover{border-color:var(--accent-line); background:var(--glass3-bg); transform:translateY(-4px); box-shadow:0 14px 30px rgba(201,164,97,.2);}
.flow-circle:active{transform:translateY(-1px) scale(.97);}
.flow-circle:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
.flow-circle.empty{opacity:.5;}
.flow-circle.empty:hover{opacity:.8;}
.flow-circle.module-circle{width:124px; height:124px; border-width:2px; color:var(--accent);}
.flow-circle .fc-badge{
  position:absolute; top:-5px; right:-5px; background:var(--accent); color:var(--accent-ink);
  font-family:var(--font-mono); font-size:10px; font-weight:700; line-height:1;
  min-width:20px; height:20px; padding:0 5px; border-radius:999px;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.flow-item .fc-label{font-size:13.5px; font-weight:600; text-align:center; line-height:1.32; max-width:132px;}
.flow-item .fc-sub{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); text-align:center;}
.flow-connector{display:flex; align-items:center; justify-content:center; flex-shrink:0; width:46px; height:96px; color:var(--ink-faint);}
.flow-connector svg{width:100%; height:auto;}
@media (max-width:700px){
  .flow-circle{width:78px; height:78px;}
  .flow-circle.module-circle{width:100px; height:100px;}
  .flow-circle svg{width:24px; height:24px;}
  .flow-item{width:104px;}
  .flow-connector{width:26px; height:78px;}
}

/* ===================== FOLDER TILES ===================== */
.folder-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:900px){ .folder-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ .folder-grid{grid-template-columns:1fr;} }
.folder-tile{
  background:var(--glass1-bg); border:1px solid var(--glass1-bd);
  border-radius:var(--r-md); padding:18px 16px; cursor:pointer;
  transition:all .18s var(--ease); position:relative;
}
.folder-tile:hover{border-color:var(--line-strong); background:var(--glass2-bg);}
.folder-tile .fname{font-size:13.5px; font-weight:600; margin-bottom:6px;}
.folder-tile .fcnt{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}
.folder-tile.zero .fcnt{color:var(--ink-faint);}
.folder-tile .badge-empty{position:absolute; top:14px; right:14px; width:6px; height:6px; border-radius:50%; background:var(--ink-faint);}

/* ===================== TABLE ===================== */
.table-wrap{
  background:var(--glass1-bg); border:1px solid var(--glass1-bd); border-radius:var(--r-lg);
  overflow:hidden;
}
table{width:100%; border-collapse:collapse;}
thead th{
  text-align:left; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-faint); padding:14px 18px; border-bottom:1px solid var(--line); font-weight:600;
  background:rgba(255,255,255,.02);
}
tbody td{padding:15px 18px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
tbody tr{transition:background .14s;}
tbody tr:hover{background:rgba(255,255,255,.03);}
tbody tr:last-child td{border-bottom:none;}
.t-name{font-weight:600; cursor:pointer;}
.t-name:hover{color:var(--accent);}
.t-desc{color:var(--ink-dim); max-width:360px;}
.t-open{
  display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--accent);
  cursor:pointer; font-family:var(--font-mono); white-space:nowrap;
}
.t-open:hover{text-decoration:underline;}
@media (max-width:760px){ .t-desc{display:none;} thead th:nth-child(2){display:none;} tbody td:nth-child(2){display:none;} }

.status-badge{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10.5px;
  font-weight:600; letter-spacing:.03em; padding:4px 9px; border-radius:999px;
}
.status-badge.active{background:var(--success-soft); color:var(--success);}
.status-badge.unmapped{background:var(--warning-soft); color:var(--warning);}
.status-badge::before{content:''; width:5px; height:5px; border-radius:50%; background:currentColor;}

.type-pill{font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-faint);}

/* ===================== EMPTY / ERROR STATES ===================== */
.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-faint);
  background:var(--glass1-bg); border:1px solid var(--glass1-bd); border-radius:var(--r-lg);
}
.empty-state .et{font-size:14px; font-weight:600; color:var(--ink-dim); margin-bottom:6px;}
.empty-state .ed{font-size:13px; max-width:380px; margin:0 auto;}

/* ===================== SYSTEM DETAIL ===================== */
.detail-wrap{display:grid; grid-template-columns:1.4fr 1fr; gap:24px;}
@media (max-width:900px){ .detail-wrap{grid-template-columns:1fr;} }
.detail-card{
  background:var(--glass2-bg); border:1px solid var(--glass2-bd); border-radius:var(--r-xl);
  padding:32px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.detail-card .type-pill{margin-bottom:14px; display:block;}
.detail-card h1{font-family:var(--font-display); font-size:28px; font-weight:600; margin:0 0 12px;}
.detail-card .desc{color:var(--ink-dim); font-size:14.5px; line-height:1.6; margin-bottom:26px;}
.cta-open{
  display:inline-flex; align-items:center; gap:9px; background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:14px; padding:13px 22px; border-radius:11px; cursor:pointer; border:none;
  transition:transform .16s var(--ease), box-shadow .16s var(--ease);
}
.cta-open:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(201,164,97,.28);}
.cta-open:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
.fav-btn{
  display:inline-flex; align-items:center; gap:8px; background:transparent; color:var(--ink-dim);
  font-weight:600; font-size:13px; padding:13px 18px; border-radius:11px; cursor:pointer;
  border:1px solid var(--line); margin-left:10px; transition:all .16s;
}
.fav-btn:hover{border-color:var(--accent-line); color:var(--accent);}

<script>
/* =========================================================================
   DSCDA DIGITAL OPERATING SYSTEM — Phase 1
   Static client-side build. No backend => no real authentication or
   server-enforced permissions. The role switcher below is a UI-only demo:
   it changes what is *shown*, not what is *secured*. Real permission
   enforcement requires a server-side authorization layer (see note in the
   Administration section of the source spec).
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. LIVE SYSTEM REGISTRY — DYNAMIC, NO HARD-CODED SYSTEMS
   Source of truth: Google Sheet "My Systems DSCDA" -> tab "system sheet".
   Columns read (per spec): B=System Name, D=System Link, E=Description,
   L=Department. Nothing about individual systems is hard-coded here —
   the sheet is fetched as published CSV and parsed at runtime.
--------------------------------------------------------------------- */
const SHEET_ID = '1Fc__Mp7v5XaxnU4tZIcRDDySZ3SagxlRQNPlCM0c7xk';
const SHEET_TAB = 'system sheet';
const COL = { NAME:1, TYPE:2, LINK:3, DESC:4, FLOW:7, DEPT:11 }; // 0-indexed: A=0 ... L=11
const REFRESH_INTERVAL_MS = 5 * 60 * 1000;   // background refresh cadence
const STALE_ON_RETURN_MS  = 2 * 60 * 1000;   // refresh if user returns after this long

/* ---------------------------------------------------------------------
   2. STRUCTURE CONFIG
   This is the business taxonomy (Areas / Modules / Circles / Folders).
   It is navigation scaffolding, not system data — no system name, link,
   description or count is hard-coded inside it. Every module/circle is
   populated purely from what the live registry assigns to it, and the
   UI hides any of these that end up with 0 systems (see foldersFor /
   nonEmptyCircles below).
--------------------------------------------------------------------- */
const MODULES = {
  'POL-NBD':{name:'Polymer — New Business Development', shortName:'New Business Development', area:'POLYMER', circles:['Marketing Leads','Sales Enquiries','NBD','General']},
  'POL-CRR':{name:'Polymer — Customer Retention & Relationship', shortName:'Customer Retention & Relationship', area:'POLYMER', circles:['O2D','D2C','CRR','MOU Tracking','General']},
  'TEX-NBD':{name:'Textile — New Business Development', shortName:'New Business Development', area:'TEXTILE', circles:['Marketing Leads','Sales Enquiries','Onboarding','General']},
  'TEX-CRR':{name:'Textile — Customer Retention & Relationship', shortName:'Customer Retention & Relationship', area:'TEXTILE', circles:['Purchase','O2D Ready','O2D Monopoly','D2C','General']},
  'ACC':{name:'Accounts', circles:['Collections','Compliance','General']},
  'HR':{name:'Human Resources', circles:['Recruitment','Joining','Exit','General']},
  'MKT':{name:'Marketing', circles:[]},
  'ADM':{name:'Administration', circles:[]}
};
const AREAS = {
  POLYMER:{name:'Polymer', modules:['POL-NBD','POL-CRR'], desc:'New Business + Customer Retention & Relationship'},
  TEXTILE:{name:'Textile', modules:['TEX-NBD','TEX-CRR'], desc:'New Business + Customer Retention & Relationship'}
};
const FUNCTIONS = ['ACC','HR','MKT','ADM'];
const FOLDERS_STD = ['01 Dashboards','02 FMS','03 Sheets & Trackers','04 Checklists','05 Forms','06 Documents','07 Prompts'];
const CIRCLE_Q = {
  'O2D':'What is moving, and what is late?',
  'D2C':'Who owes money, and who should be chased?',
  'CRR':'Which relationships need attention right now?',
  'MOU Tracking':'Which agreements are active, expiring, or breached?',
  'NBD':'Which new-business opportunities are progressing?',
  'Sales Enquiries':'Which enquiries are open, and who owns them?',
  'Marketing Leads':'Which leads have come in, and where do they stand?',
  'Onboarding':'Which new customers are mid-onboarding?',
  'Purchase':'What has been ordered from vendors, and what is pending?',
  'O2D Ready':'What is ready to dispatch, and what is blocking it?',
  'O2D Monopoly':'What is moving through the Monopoly pipeline, and what is late?',
  'Recruitment':'Who is in the hiring pipeline, and at what stage?',
  'Joining':'Who is joining, and is their paperwork complete?',
  'Exit':'Who is exiting, and is the offboarding complete?',
  'Collections':'Who owes money, and who should be chased?',
  'Compliance':'What regulatory or legal obligations are open?',
  'General':'What systems fall under this department right now?'
};

const ROLES = {
  MD:{label:'Managing Director', home:'EXECUTIVE COMMAND CENTER', sees:'ALL'},
  PC:{label:'Process Coordinator', home:'EXECUTION CONTROL TOWER', sees:'ALL'},
  POLYMER:{label:'Polymer', home:'POLYMER DIGITAL WORKSPACE', sees:['POL-NBD','POL-CRR']},
  TEXTILE:{label:'Textile', home:'TEXTILE DIGITAL WORKSPACE', sees:['TEX-NBD','TEX-CRR']},
  ACCOUNTS:{label:'Accounts', home:'ACCOUNTS WORKSPACE', sees:['ACC']},
  HR:{label:'HR', home:'HR WORKSPACE', sees:['HR']},
  MARKETING:{label:'Marketing', home:'MARKETING WORKSPACE', sees:['MKT']},
  ADMINISTRATION:{label:'Administration', home:'ADMINISTRATION WORKSPACE', sees:['ADM']}
};

/* ---------------------------------------------------------------------
   3. DEPARTMENT -> MODULE CLASSIFICATION (dynamic, from column L)
   Column L only ever contains a department name — never a module or a
   circle, so those aren't in the sheet. This table is the one place
   that says "this department name belongs to this part of the existing
   navigation tree". If a department in the sheet isn't recognised here,
   the system is NOT dropped — it is placed in "Needs Configuration" per
   spec item 9, and stays fully visible/searchable there.
--------------------------------------------------------------------- */
const DEPT_TO_MODULE = {
  'POLYMER':      {module:'POL-CRR', circle:'General'},
  'TEXTILE':      {module:'TEX-CRR', circle:'General'},
  'ACCOUNTS':     {module:'ACC',     circle:'General'},
  'ACC':          {module:'ACC',     circle:'General'},
  'HR':           {module:'HR',      circle:'General'},
  'MARKETING':    {module:'MKT',     circle:null},
  'MKT':          {module:'MKT',     circle:null},
  'ADMINISTRATION':{module:'ADM',    circle:null},
  'ADMIN':        {module:'ADM',     circle:null},
  'ADM':          {module:'ADM',     circle:null},
  'MDO':          {module:'ADM',     circle:null},
  'MAINTENANCE':  {module:'ADM',     circle:null},
  'ALL':          {module:'COMPANYWIDE', circle:null},
  'MD':           {module:'COMPANYWIDE', circle:null}
};
/* The sheet's Department column only ever holds a bare area name
   (POLYMER / TEXTILE) — it has no separate column for module (NBD vs
   CRR) or business stage. So a bare "POLYMER"/"TEXTILE" department is
   further routed by matching System Name + Description against the
   approved stage vocabulary (spec #16), same fallback pattern already
   used for System Type below. If nothing matches, the system safely
   stays in the module/circle DEPT_TO_MODULE already assigns (CRR /
   General) — nothing is ever dropped or hidden.
   If the sheet is later given a dedicated stage/process column, that
   should replace this heuristic as the source of truth. */
const STAGE_KEYWORDS = {
  POLYMER: [
    {re:/MARKETING\s*LEAD/,                         module:'POL-NBD', circle:'Marketing Leads'},
    {re:/SALES\s*ENQUIR/,                            module:'POL-NBD', circle:'Sales Enquiries'},
    {re:/\bNBD\b|NEW\s*BUSINESS/,                    module:'POL-NBD', circle:'NBD'},
    {re:/\bMOU\b/,                                   module:'POL-CRR', circle:'MOU Tracking'},
    {re:/\bO2D\b|ORDER\s*TO\s*DELIVERY|DISPATCH|\bOTD\b|ON.?TIME\s*DELIVERY|DELIVERY\s*PUNCTUALITY/, module:'POL-CRR', circle:'O2D'},
    {re:/\bD2C\b|COLLECTION|DEBTOR|RECEIVABLE/,      module:'POL-CRR', circle:'D2C'},
    {re:/\bCRR\b|RETENTION|RELATIONSHIP/,            module:'POL-CRR', circle:'CRR'}
  ],
  TEXTILE: [
    {re:/MARKETING\s*LEAD/,                          module:'TEX-NBD', circle:'Marketing Leads'},
    {re:/SALES\s*ENQUIR/,                            module:'TEX-NBD', circle:'Sales Enquiries'},
    {re:/ONBOARD/,                                   module:'TEX-NBD', circle:'Onboarding'},
    {re:/O2D\s*READY|READY\s*TO\s*DISPATCH/,         module:'TEX-CRR', circle:'O2D Ready'},
    {re:/O2D\s*MONOPOLY|MONOPOLY/,                   module:'TEX-CRR', circle:'O2D Monopoly'},
    {re:/PURCHASE|VENDOR|PROCURE/,                   module:'TEX-CRR', circle:'Purchase'},
    {re:/\bD2C\b|COLLECTION|DEBTOR|RECEIVABLE/,      module:'TEX-CRR', circle:'D2C'}
  ]
};
/* The sheet now carries an explicit "Business Flow" column (H), filled
   in per-system as "NBD > Marketing Leads", "CRR > O2D", etc. — this is
   the authoritative source for module + stage and is used first. Where
   it's blank (administrative/reference systems the business owner
   hasn't tagged to a specific stage), we fall back to the keyword
   guess below, and finally to the flat DEPT_TO_MODULE default. Nothing
   is ever dropped — an unmatched stage safely lands in that module's
   General circle instead of vanishing. */
function classifyDept(deptRaw, nameForGuess, descForGuess, flowRaw){
  const key = (deptRaw||'').toString().trim().toUpperCase();
  if(!key) return {module:'UNMAPPED', circle:null};
  const hit = DEPT_TO_MODULE[key];
  if(!hit) return {module:'UNMAPPED', circle:null};

  if(key==='POLYMER' || key==='TEXTILE'){
    const areaPrefix = key==='POLYMER' ? 'POL-' : 'TEX-';
    const flow = (flowRaw||'').toString().trim();
    if(flow){
      const parts = flow.split('>').map(s=>s.trim()).filter(Boolean);
      if(parts.length>=2){
        const moduleKey = areaPrefix + parts[0].toUpperCase();
        const circleRaw = parts[1];
        const modCfg = MODULES[moduleKey];
        if(modCfg){
          const exact = modCfg.circles.find(c => c.toUpperCase()===circleRaw.toUpperCase());
          if(exact) return {module:moduleKey, circle:exact};
          // Known ambiguity: sheet sometimes just says "O2D" for Textile CRR,
          // which has two distinct O2D stages — disambiguate from the name.
          if(moduleKey==='TEX-CRR' && circleRaw.toUpperCase()==='O2D'){
            const hay = (nameForGuess||'').toUpperCase();
            if(hay.includes('MONOPOLY')) return {module:moduleKey, circle:'O2D Monopoly'};
            if(hay.includes('READY'))    return {module:moduleKey, circle:'O2D Ready'};
          }
          // Module identified but the circle text didn't match the approved
          // list for it — safe default within that module, not dropped.
          return {module:moduleKey, circle:'General'};
        }
      }
    }
    if(STAGE_KEYWORDS[key]){
      const hay = ((nameForGuess||'')+' '+(descForGuess||'')).toUpperCase();
      for(const rule of STAGE_KEYWORDS[key]){
        if(rule.re.test(hay)) return {module:rule.module, circle:rule.circle};
      }
    }
  }
  return hit;
}

/* ---------------------------------------------------------------------
   4. TYPE -> FOLDER CLASSIFICATION
   Column C ("System Type") holds a real, clean value in the sheet
   (FMS, SHEET, CHECKLIST, TRACKER, DOCUMENT, IMS, DASH, MIS,
   DELEGATION, FORM) — this maps that value to a display label and a
   folder. If column C is blank or holds something unrecognised, we
   fall back to a keyword guess on the name rather than losing the
   system, and it's clearly flagged so it can be fixed in the sheet.
--------------------------------------------------------------------- */
const TYPE_MAP = {
  DASH:{label:'DASHBOARD', folder:'01 Dashboards'},
  MIS:{label:'DASHBOARD', folder:'01 Dashboards'},
  FMS:{label:'FMS', folder:'02 FMS'},
  IMS:{label:'IMS', folder:'02 FMS'},
  CHECKLIST:{label:'CHECKLIST', folder:'04 Checklists'},
  FORM:{label:'FORM', folder:'05 Forms'},
  DOCUMENT:{label:'DOCUMENT', folder:'06 Documents'},
  TRACKER:{label:'TRACKER', folder:'03 Sheets & Trackers'},
  SHEET:{label:'SHEET', folder:'03 Sheets & Trackers'},
  DELEGATION:{label:'DELEGATION', folder:'03 Sheets & Trackers'}
};
function classifyTypeFromName(name){ // fallback only, used if column C is blank/unrecognised
  const n = (name||'').toUpperCase();
  if(n.includes('DASHBOARD') || n.includes('DASH')) return {type:'DASH', ...TYPE_MAP.DASH};
  if(n.includes('FMS'))        return {type:'FMS', ...TYPE_MAP.FMS};
  if(n.includes('IMS'))        return {type:'IMS', ...TYPE_MAP.IMS};
  if(n.includes('CHECKLIST'))  return {type:'CHECKLIST', ...TYPE_MAP.CHECKLIST};
  if(n.includes('FORM'))       return {type:'FORM', ...TYPE_MAP.FORM};
  if(n.includes('DOCUMENT') || n.includes('LETTER')) return {type:'DOCUMENT', ...TYPE_MAP.DOCUMENT};
  if(n.includes('TRACKER'))    return {type:'TRACKER', ...TYPE_MAP.TRACKER};
  return {type:'SHEET', ...TYPE_MAP.SHEET};
}
function classifyType(name, typeRaw){
  const key = (typeRaw||'').toString().trim().toUpperCase();
  if(key && TYPE_MAP[key]) return {type:key, ...TYPE_MAP[key]};
  return classifyTypeFromName(name); // column C blank/unrecognised — guess from name, don't drop the system
}

/* ---------------------------------------------------------------------
   5. CSV PARSING + REGISTRY BUILD
--------------------------------------------------------------------- */
function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function buildItemsFromRows(rows){
  const seen = new Set();
  const items = [];
  let idx = 0;
  rows.forEach(r=>{
    if(!r || !r.length) return;
    const name = (r[COL.NAME]||'').trim();
    if(!name) return; // spec #9: missing name => not a valid system, skip
    const typeRaw = (r[COL.TYPE]||'').trim();
    const link = (r[COL.LINK]||'').trim();
    const descRaw = (r[COL.DESC]||'').trim();
    const flowRaw = (r[COL.FLOW]||'').trim();
    const deptRaw = (r[COL.DEPT]||'').trim();

    const dedupeKey = (name+'|'+link).toLowerCase(); // spec #10
    if(seen.has(dedupeKey)) return;
    seen.add(dedupeKey);

    const cls = classifyType(name, typeRaw);
    const dept = classifyDept(deptRaw, name, descRaw, flowRaw);

    items.push({
      id:'sys-'+(idx++), name,
      type:cls.type, typeLabel:cls.label, folder:cls.folder,
      url: link, hasLink: !!link,
      desc: descRaw || 'No description available.',
      dept: deptRaw,
      module: dept.module, circle: dept.circle,
      unmapped: dept.module==='UNMAPPED'
    });
  });
  return items;
}

/* ---------------------------------------------------------------------
   6. REGISTRY LOADING / AUTO-REFRESH (spec #8)
   Load on start, refresh when the tab regains focus if the cache is
   stale, and refresh on a background interval. No system data persists
   beyond the in-memory ITEMS array — every load re-reads the sheet.
--------------------------------------------------------------------- */
let ITEMS = [];
let liveMode = false;
let lastUpdated = null;
let registryError = null;
let loadingRegistry = false;

async function loadRegistry(manual){
  if(loadingRegistry) return;
  loadingRegistry = true;
  if(manual) setLiveBadge(null, 'REFRESHING…');
  try{
    const url = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(SHEET_TAB)+'&_='+Date.now();
    const res = await fetch(url, {mode:'cors'});
    if(!res.ok) throw new Error('Registry sheet is not reachable/public.');
    const text = await res.text();
    if(!text || text.trim().startsWith('<')) throw new Error('Registry did not return CSV — check sheet sharing.');
    const rows = parseCSV(text);
    rows.shift(); // header row
    const items = buildItemsFromRows(rows);
    ITEMS = items;
    liveMode = true;
    registryError = null;
    lastUpdated = new Date();
  }catch(e){
    liveMode = false;
    registryError = e.message || 'Could not load the system registry.';
    if(!lastUpdated){ ITEMS = []; } // no stale cache to fall back to yet
  }
  loadingRegistry = false;
  setLiveBadge(liveMode);
  updateLastUpdatedUI();
  render();
}
function setLiveBadge(isLive, overrideText){
  const el = document.getElementById('liveBadge');
  if(!el) return;
  el.textContent = overrideText || (isLive ? 'LIVE REGISTRY' : (lastUpdated ? 'CACHED REGISTRY' : 'REGISTRY UNAVAILABLE'));
}
function fmtTime(d){
  if(!d) return '—';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function updateLastUpdatedUI(){
  const badge = document.getElementById('lastUpdatedBadge');
  if(badge) badge.textContent = fmtTime(lastUpdated);
  const footer = document.getElementById('footerUpdated');
  if(footer){
    footer.textContent = lastUpdated
      ? 'Last updated ' + fmtTime(lastUpdated) + (liveMode ? '' : ' (cached)')
      : (registryError ? 'Registry unavailable — ' + registryError : 'Loading registry…');
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && lastUpdated && (Date.now()-lastUpdated.getTime() > STALE_ON_RETURN_MS)){
    loadRegistry();
  }
});
setInterval(()=>{ loadRegistry(); }, REFRESH_INTERVAL_MS);

/* ---------------------------------------------------------------------
   6. STATE
--------------------------------------------------------------------- */
const state = {
  role: 'MD',
  route: {type:'home'},
  history: [],
  favorites: new Set(),
  recents: [],
  searchOpen: false,
  searchQuery: ''
};

function currentDeptScope(){
  const r = ROLES[state.role];
  if(r.sees==='ALL') return null;
  return r.sees;
}
function visibleItems(){
  const scope = currentDeptScope();
  if(!scope) return ITEMS;
  return ITEMS.filter(it=> scope.includes(it.module) || (it.module==='COMPANYWIDE'));
}
function itemsFor(filterFn){ return visibleItems().filter(filterFn); }

function navigate(route, opts){
  opts = opts||{};
  if(!opts.replace) state.history.push(state.route);
  state.route = route;
  if(route.type==='system'){
    const it = ITEMS.find(i=>i.id===route.id);
    if(it){
      state.recents = state.recents.filter(r=>r.id!==it.id);
      state.recents.unshift({id:it.id, ts:Date.now()});
      state.recents = state.recents.slice(0,8);
    }
  }
  closeOverlays();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  const prev = state.history.pop();
  if(prev){ state.route = prev; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  else navigate({type:'home'}, {replace:true});
}
function closeOverlays(){
  state.searchOpen=false;
  document.getElementById('overlayRoot').innerHTML='';
  document.getElementById('profilePop').innerHTML='';
  document.getElementById('notifPop').innerHTML='';
}

/* ---------------------------------------------------------------------
   7. RENDER HELPERS
--------------------------------------------------------------------- */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const svgArrow = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const svgStar  = (on)=>'<svg width="15" height="15" viewBox="0 0 24 24" fill="'+(on?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8"><path d="m12 2 3.1 6.7 7.4.9-5.4 5 1.5 7.3L12 18.3 5.4 21.9 6.9 14.6 1.5 9.6l7.4-.9z"/></svg>';

function moduleCircleItems(module, circle){
  return itemsFor(it=> it.module===module && it.circle===circle);
}
function moduleDirectItems(module){ // for ADM/MKT (no circles)
  return itemsFor(it=> it.module===module);
}
function foldersFor(list, module){
  const folders = module==='ADM' ? FOLDERS_STD.concat(['08 Delegation']) : FOLDERS_STD;
  // Spec #4: a folder with 0 systems is hidden entirely, and reappears
  // automatically the moment the live registry gives it a system again.
  return folders.map(f=>({ name:f, items:list.filter(i=>i.folder===f) })).filter(f=>f.items.length>0);
}

function renderCrumbs(parts){
  let html = '<div class="crumbs">';
  parts.forEach((p,i)=>{
    if(i>0) html += '<span class="cr-sep">/</span>';
    if(i===parts.length-1) html += '<span class="cr-current">'+esc(p.label)+'</span>';
    else html += '<span class="cr-link" data-crumb=\''+JSON.stringify(p.route).replace(/'/g,"&#39;")+'\'>'+esc(p.label)+'</span>';
  });
  html += '</div>';
  return html;
}
function renderBack(){
  return state.history.length ? '<div class="back-btn" id="backBtn">&larr; Back</div>' : '';
}

function statusBadge(it){
  if(it.unmapped) return '<span class="status-badge unmapped">Needs configuration</span>';
  return '<span class="status-badge active">Active</span>';
}

function renderSystemTable(list){
  if(list.length===0){
    return '<div class="empty-state"><div class="et">No systems in this folder yet</div><div class="ed">This area is reserved for future systems. It will populate automatically once items are added to the registry.</div></div>';
  }
  let rows = list.map(it=>`
    <tr>
      <td><span class="t-name" data-open="${it.id}">${esc(it.name)}</span><div class="type-pill">${esc(it.typeLabel)}</div></td>
      <td class="t-desc">${esc(it.desc||'No description provided.')}</td>
      <td>${statusBadge(it)}</td>
      <td><span class="t-open" data-open="${it.id}">Open detail ${svgArrow}</span></td>
    </tr>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>System</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function viewHome(){
  const role = ROLES[state.role];
  const scoped = role.sees!=='ALL';
  const scopeNote = scoped ? `<div class="role-note">You're viewing the <b>${esc(role.label)}</b> workspace. Switch roles from the profile menu to preview other views — this is a display filter only, not enforced security.</div>` : '';

  const polyCount = itemsFor(i=>MODULES[i.module]?.area==='POLYMER').length;
  const texCount = itemsFor(i=>MODULES[i.module]?.area==='TEXTILE').length;
  const polyCircles = new Set(nonEmptyCircles('POL-NBD').concat(nonEmptyCircles('POL-CRR'))).size;
  const texCircles = new Set(nonEmptyCircles('TEX-NBD').concat(nonEmptyCircles('TEX-CRR'))).size;

  let areasHtml = '';
  if(!scoped || role.sees.includes('POLYMER')){
    areasHtml += `<div class="area-card reveal" data-nav="area" data-key="POLYMER">
      <div class="glow"></div>
      <div class="ic">${iconPolymer()}</div>
      <h3>Polymer</h3>
      <p class="desc">${esc(AREAS.POLYMER.desc)}</p>
      <div class="stats"><span><b>${polyCircles}</b> circles</span><span><b>${polyCount}</b> systems</span></div>
      <div class="explore">EXPLORE ${svgArrow}</div></div>`;
  }
  if(!scoped || role.sees.includes('TEXTILE')){
    areasHtml += `<div class="area-card reveal" data-nav="area" data-key="TEXTILE">
      <div class="glow"></div>
      <div class="ic">${iconTextile()}</div>
      <h3>Textile</h3>
      <p class="desc">${esc(AREAS.TEXTILE.desc)}</p>
      <div class="stats"><span><b>${texCircles}</b> circles</span><span><b>${texCount}</b> systems</span></div>
      <div class="explore">EXPLORE ${svgArrow}</div></div>`;
  }

  let fnHtml = '';
  FUNCTIONS.forEach(m=>{
    if(scoped && !role.sees.includes(m)) return;
    const cnt = moduleDirectOrCircleItems(m).length;
    if(cnt===0) return; // spec #4: hide zero-system modules; reappears automatically once populated
    fnHtml += `<div class="fn-card reveal" data-nav="module" data-key="${m}">
      <div class="ic">${iconFn(m)}</div>
      <h4>${MODULES[m].name}</h4>
      <div class="cnt">${cnt} SYSTEMS</div>
      <div class="explore">Explore ${svgArrow}</div></div>`;
  });

  const favItems = ITEMS.filter(i=>state.favorites.has(i.id));
  const recentItems = state.recents.map(r=>ITEMS.find(i=>i.id===r.id)).filter(Boolean);

  const companyWide = itemsFor(i=>i.module==='COMPANYWIDE');
  const unmapped = itemsFor(i=>i.unmapped);
  const govCount = companyWide.length + unmapped.length;

  return `
    <div class="hero reveal">
      <div class="eyebrow">DSCDA</div>
      <h1>Digital Operating System</h1>
      <p>One digital front door to the company's business systems.</p>
    </div>
    ${scopeNote}
    <div class="section">
      <div class="section-head"><div><div class="st">Business Areas</div><h2>Navigate the operating ecosystem</h2></div></div>
      <div class="areas-grid">${areasHtml || '<div class="empty-state">No business areas available for this role.</div>'}</div>
    </div>
    <div class="section">
      <div class="section-head"><div><div class="st">Functions</div><h2>Company-wide operations</h2></div></div>
      <div class="fn-grid">${fnHtml || '<div class="empty-state">No functions available for this role.</div>'}</div>
    </div>
    ${favItems.length ? `<div class="section">
      <div class="section-head"><div><div class="st">Your Favorites</div><h2>Pinned systems</h2></div></div>
      <div class="chip-row">${favItems.map(i=>`<div class="pill-chip" data-open="${i.id}">${svgStar(true)} ${esc(i.name)} <span class="pt">${esc(i.typeLabel)}</span></div>`).join('')}</div>
    </div>` : ''}
    ${recentItems.length ? `<div class="section">
      <div class="section-head"><div><div class="st">Recently Used</div><h2>Pick up where you left off</h2></div></div>
      <div class="chip-row">${recentItems.map(i=>`<div class="pill-chip" data-open="${i.id}">${esc(i.name)} <span class="pt">${esc(i.typeLabel)}</span></div>`).join('')}</div>
    </div>` : ''}
    ${(state.role==='MD'||state.role==='PC') ? `<div class="section">
      <div class="section-head"><div><div class="st">Executive Attention</div><h2>Company-wide &amp; unmapped systems</h2><div class="sd">${govCount} systems sit outside the eight business modules — dashboards shared across the company, or registry entries still awaiting module/circle configuration.</div></div>
        <div class="fn-card" style="cursor:pointer; min-width:180px;" data-nav="companywide">
          <div class="ic">${iconGov()}</div><h4>${govCount}</h4><div class="cnt">VIEW ALL</div>
        </div>
      </div>
    </div>` : ''}
  `;
}

function moduleDirectOrCircleItems(m){
  return MODULES[m].circles.length ? itemsFor(i=>i.module===m) : itemsFor(i=>i.module===m);
}

function nonEmptyCircles(module){
  // Spec #4: circles/processes with 0 systems are hidden, and reappear
  // automatically once the live registry assigns them a system.
  return MODULES[module].circles.filter(c=>moduleCircleItems(module,c).length>0);
}
function viewArea(key){
  // Approved business hierarchy: Business Area -> Module (NBD / CRR shown
  // as circular nodes, horizontal flow) -> Business Stage -> Folder -> System.
  const area = AREAS[key];
  const mods = area.modules;
  const anyPopulated = mods.some(m=>moduleDirectOrCircleItems(m).length>0);
  const flowHtml = mods.map((m,idx)=>{
    const mod = MODULES[m];
    const cnt = moduleDirectOrCircleItems(m).length;
    return `<div class="flow-item">
        <div class="flow-circle module-circle" data-nav="module" data-key="${m}" role="button" tabindex="0" aria-label="${esc(mod.shortName||mod.name)}">
          ${moduleFlowIcon(m)}
        </div>
        <div class="fc-label">${esc(mod.shortName||mod.name)}</div>
        <div class="fc-sub">${cnt} system${cnt===1?'':'s'}</div>
      </div>${idx<mods.length-1?flowConnector():''}`;
  }).join('');
  return `
    ${renderBack()}
    ${renderCrumbs([{label:'DSCDA', route:{type:'home'}},{label:area.name}])}
    <div class="hero" style="padding:6px 0 8px; text-align:left;">
      <h1 style="font-size:34px;">${esc(area.name)}</h1>
      <p style="margin:0;">${esc(area.desc)}</p>
    </div>
    <div class="section">
      <div class="section-head"><div><div class="st">Modules</div><h2>Choose a business process</h2></div></div>
      ${anyPopulated
        ? `<div class="flow-wrap"><div class="flow-row">${flowHtml}</div></div>`
        : '<div class="empty-state"><div class="et">No systems in this area yet</div><div class="ed">This area will populate automatically once the registry assigns systems to it.</div></div>'}
    </div>
  `;
}

function renderCircleNode(module, circle){
  const list = moduleCircleItems(module, circle);
  const q = CIRCLE_Q[circle] || 'What does this process need attention on?';
  const empty = list.length===0;
  return `<div class="circle-node ${empty?'empty':''}" data-nav="circle" data-module="${module}" data-circle="${esc(circle)}">
    <div class="top"><div class="name"><span class="dot"></span>${esc(circle)}</div></div>
    <div class="q">${esc(q)}</div>
    <div class="foot"><span class="cnt">${list.length} System${list.length===1?'':'s'}</span><span class="arrow">${svgArrow}</span></div>
  </div>`;
}

function viewModule(key){
  const mod = MODULES[key];
  if(mod.area){
    // Polymer / Textile — approved circular, horizontal business-stage flow
    const area = AREAS[mod.area];
    const circles = nonEmptyCircles(key);
    const flowHtml = circles.map((c,idx)=>{
      const list = moduleCircleItems(key,c);
      const empty = list.length===0;
      return `<div class="flow-item">
          <div class="flow-circle ${empty?'empty':''}" data-nav="circle" data-module="${key}" data-circle="${esc(c)}" role="button" tabindex="0" aria-label="${esc(c)}">
            ${stageFlowIcon(c)}
            ${!empty?`<span class="fc-badge">${list.length}</span>`:''}
          </div>
          <div class="fc-label">${esc(c)}</div>
        </div>${idx<circles.length-1?flowConnector():''}`;
    }).join('');
    return `
      ${renderBack()}
      ${renderCrumbs([{label:'DSCDA', route:{type:'home'}},{label:area.name, route:{type:'area', key:mod.area}},{label:mod.shortName||mod.name}])}
      <div class="hero" style="padding:6px 0 8px; text-align:left;">
        <h1 style="font-size:32px;">${esc(mod.shortName||mod.name)}</h1>
        <p style="margin:0;">${esc(area.name)} · Business process flow</p>
      </div>
      <div class="section">
        <div class="section-head"><div><div class="st">Business Flow</div><h2>Follow the process stages</h2></div></div>
        ${circles.length
          ? `<div class="flow-wrap"><div class="flow-row">${flowHtml}</div></div>`
          : '<div class="empty-state"><div class="et">No systems in this module yet</div><div class="ed">This will populate automatically once the registry assigns systems here.</div></div>'}
      </div>
    `;
  }
  if(mod.circles.length===0){
    // ACC/HR use circles above; MKT/ADM go straight to folders
    const list = moduleDirectItems(key);
    const folders = foldersFor(list, key);
    return `
      ${renderBack()}
      ${renderCrumbs([{label:'DSCDA', route:{type:'home'}},{label:mod.name}])}
      <div class="hero" style="padding:6px 0 8px; text-align:left;">
        <h1 style="font-size:32px;">${esc(mod.name)}</h1>
        <p style="margin:0;">Direct folder navigation — this function has no process circles.</p>
      </div>
      <div class="section"><div class="section-head"><div><div class="st">System Ecosystem</div><h2>Folders</h2></div></div>
      <div class="folder-grid">${folders.map(f=>renderFolderTile(key,null,f)).join('')}</div></div>
    `;
  }
  // ACC / HR — module page with circles
  return `
    ${renderBack()}
    ${renderCrumbs([{label:'DSCDA', route:{type:'home'}},{label:mod.name}])}
    <div class="hero" style="padding:6px 0 8px; text-align:left;">
      <h1 style="font-size:32px;">${esc(mod.name)}</h1>
    </div>
    <div class="section"><div class="section-head"><div><div class="st">Circles</div><h2>Business processes</h2></div></div>
    <div class="circle-grid">${nonEmptyCircles(key).map(c=>renderCircleNode(key,c)).join('') || '<div class="empty-state"><div class="et">No systems in this module yet</div><div class="ed">This will populate automatically once the registry assigns systems here.</div></div>'}</div></div>
  `;
}

function renderFolderTile(module, circle, folder){
  const cnt = folder.items.length;
  return `<div class="folder-tile ${cnt===0?'zero':''}" data-nav="folder" data-module="${module}" data-circle="${circle?esc(circle):''}" data-folder="${esc(folder.name)}">
    ${cnt===0?'<span class="badge-empty"></span>':''}
    <div class="fname">${esc(folder.name)}</div>
    <div class="fcnt">${cnt} system${cnt===1?'':'s'}</div>
  </div>`;
}

function viewCircle(module, circle){
  const mod = MODULES[module];
  const area = mod.area ? AREAS[mod.area] : null;
  const list = moduleCircleItems(module, circle);
  const folders = foldersFor(list, module);
  const q = CIRCLE_Q[circle] || 'What does this process need attention on?';
  const crumbParts = area
    ? [{label:'DSCDA', route:{type:'home'}},{label:area.name, route:{type:'area', key:mod.area}},{label:mod.shortName||mod.name, route:{type:'module', key:module}},{label:circle}]
    : [{label:'DSCDA', route:{type:'home'}},{label:mod.name, route:{type:'module', key:module}},{label:circle}];
  return `
    ${renderBack()}
    ${renderCrumbs(crumbParts)}
    <div class="hero" style="padding:6px 0 8px; text-align:left;">
      <h1 style="font-size:30px;">${esc(circle)}</h1>
      <p style="margin:0;">${esc(q)}</p>
    </div>
    <div class="section"><div class="section-head"><div><div class="st">System Ecosystem</div><h2>Folders</h2></div></div>
    <div class="folder-grid">${folders.map(f=>renderFolderTile(module,circle,f)).join('')}</div></div>
  `;
}

function viewFolder(module, circle, folderName){
  const mod = MODULES[module];
  const area = mod.area ? AREAS[mod.area] : null;
  const base = circle ? moduleCircleItems(module,circle) : moduleDirectItems(module);
  const list = base.filter(i=>i.folder===folderName);
  let crumbParts = [{label:'DSCDA', route:{type:'home'}}];
  if(area){
    crumbParts.push({label:area.name, route:{type:'area', key:mod.area}});
    crumbParts.push({label:mod.shortName||mod.name, route:{type:'module', key:module}});
  } else {
    crumbParts.push({label:mod.name, route:{type:'module', key:module}});
  }
  if(circle) crumbParts.push({label:circle, route:{type:'circle', module, circle}});
  crumbParts.push({label:folderName});
  return `
    ${renderBack()}
    ${renderCrumbs(crumbParts)}
    <div class="hero" style="padding:6px 0 8px; text-align:left;">
      <h1 style="font-size:28px;">${esc(folderName)}</h1>
      <p style="margin:0;">${circle?esc(circle)+' · ':''}${esc(mod.name)}</p>
    </div>
    <div class="section">${renderSystemTable(list)}</div>
  `;
}

function viewSystem(id){
  const it = ITEMS.find(i=>i.id===id);
  if(!it) return `<div class="empty-state"><div class="et">System not found</div><div class="ed">This system may have been removed from the registry.</div></div>`;
  const mod = it.module!=='COMPANYWIDE' && it.module!=='UNMAPPED' ? MODULES[it.module] : null;
  const area = mod && mod.area ? AREAS[mod.area] : null;
  let crumbParts = [{label:'DSCDA', route:{type:'home'}}];
  if(area){
    crumbParts.push({label:area.name, route:{type:'area', key:mod.area}});
    crumbParts.push({label:mod.shortName||mod.name, route:{type:'module', key:it.module}});
  } else if(mod) crumbParts.push({label:mod.name, route:{type:'module', key:it.module}});
  else crumbParts.push({label: it.module==='UNMAPPED' ? 'Needs Configuration' : 'Company-Wide', route:{type:'companywide'}});
  if(it.circle) crumbParts.push({label:it.circle, route:{type:'circle', module:it.module, circle:it.circle}});
  crumbParts.push({label:it.name});

  const isFav = state.favorites.has(it.id);
  const notAssigned = (v)=> v ? esc(v) : '<span style="font-style:italic; color:var(--ink-faint);">Not Assigned</span>';

  return `
    ${renderBack()}
    ${renderCrumbs(crumbParts)}
    <div class="detail-wrap section" style="margin-top:14px;">
      <div class="detail-card reveal">
        <span class="type-pill">${esc(it.typeLabel)}</span>
        ${it.unmapped ? '<div class="role-note" style="margin-bottom:16px;">This system exists in the registry but has not been mapped to a business module yet. It is flagged, not hidden, pending governance review.</div>' : ''}
        <h1>${esc(it.name)}</h1>
        <p class="desc">${esc(it.desc || 'No description provided in the registry.')}</p>
        <button class="cta-open" data-openurl="${esc(it.url)}" ${it.hasLink?'':'disabled'}>${it.hasLink ? 'Open System '+svgArrow : 'Link not configured'}</button>
        <button class="fav-btn ${isFav?'on':''}" data-fav="${it.id}">${svgStar(isFav)} ${isFav?'Favorited':'Add to Favorites'}</button>
      </div>
      <div class="meta-panel reveal">
        <div class="meta-row"><span class="k">Status</span><span class="v">${it.unmapped?'Needs Configuration':'Active'}</span></div>
        <div class="meta-row"><span class="k">Department</span><span class="v">${notAssigned(it.dept)}</span></div>
        <div class="meta-row"><span class="k">Module</span><span class="v">${mod ? esc(mod.name) : (it.module==='COMPANYWIDE'?'Company-Wide':'Not Assigned')}</span></div>
        <div class="meta-row"><span class="k">Circle</span><span class="v">${notAssigned(it.circle)}</span></div>
        <div class="meta-row"><span class="k">Folder</span><span class="v">${esc(it.folder)}</span></div>
        <div class="meta-row"><span class="k">System Type</span><span class="v">${esc(it.typeLabel)}</span></div>
        <div class="meta-row"><span class="k">Link</span><span class="v">${it.hasLink ? '<span style="color:var(--success);">Configured</span>' : '<span style="color:var(--warning);">Link not configured</span>'}</span></div>
      </div>
    </div>
  `;
}

function viewCompanyWide(){
  const companyWide = itemsFor(i=>i.module==='COMPANYWIDE');
  const unmapped = itemsFor(i=>i.unmapped);
  return `
    ${renderBack()}
    ${renderCrumbs([{label:'DSCDA', route:{type:'home'}},{label:'Company-Wide & Unmapped'}])}
    <div class="hero" style="padding:6px 0 8px; text-align:left;">
      <h1 style="font-size:30px;">Company-Wide &amp; Unmapped Systems</h1>
      <p style="margin:0;">Systems shared across every department, plus registry entries that haven't been assigned a business module yet. Nothing here is hidden — data quality issues are surfaced, not silently fixed.</p>
    </div>
    <div class="section"><div class="section-head"><div><div class="st">Company-Wide</div><h2>Department: ALL / MD</h2></div></div>
      ${renderSystemTable(companyWide)}
    </div>
    <div class="section"><div class="section-head"><div><div class="st">Needs Configuration</div><h2>Unmapped systems</h2><div class="sd">Registered but not yet assigned to one of the eight business modules (e.g. Department = SALES).</div></div></div>
      ${renderSystemTable(unmapped)}
    </div>
  `;
}

function iconPolymer(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>'; }
function iconTextile(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M4 10h16M10 4v16"/></svg>'; }
function iconFn(m){
  const map = {ACC:'<path d="M3 10h18M6 6h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/>',
    HR:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 8.5a2.8 2.8 0 1 1 0-5.6M21.5 20a5.5 5.5 0 0 0-6-5.4"/>',
    MKT:'<path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 9a3 3 0 0 1 0 6"/>',
    ADM:'<path d="M12 3l8 4v5c0 5-3.5 7.8-8 9-4.5-1.2-8-4-8-9V7z"/>'};
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+(map[m]||'')+'</svg>';
}
function iconGov(){ return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="9"/></svg>'; }

/* Module-level icons (NBD / CRR) and business-stage icons for the
   Polymer & Textile circular business flow. Purely presentational —
   keyed off the same MODULES/circles config, nothing hard-coded about
   systems. */
function moduleFlowIcon(key){
  const isNBD = key.endsWith('NBD');
  const path = isNBD
    ? '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'
    : '<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M22.5 21v-2a4 4 0 0 0-3-3.87"/><path d="M15.5 3.13a4 4 0 0 1 0 7.75"/>';
  return '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}

  'mou tracking': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15.5l2 2 4.5-4.5"/>',

  'o2d ready': '<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',

function stageFlowIcon(name){
  const key = (name||'').toLowerCase();
  const path = STAGE_ICON_PATHS[key] || STAGE_ICON_PATHS['general'];
  return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
}
function flowConnector(){
  return '<div class="flow-connector"><svg viewBox="0 0 46 20" fill="none"><line x1="0" y1="10" x2="34" y2="10" stroke="currentColor" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/><path d="M29 4l8 6-8 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
}

/* ---------------------------------------------------------------------
   10. ROUTER / RENDER
--------------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  if(ITEMS.length===0 && !lastUpdated){
    app.innerHTML = loadingRegistry || (!liveMode && !registryError)
      ? `<div class="hero reveal"><div class="eyebrow">DSCDA</div><h1>Digital Operating System</h1><p>Loading the live system registry…</p></div>`
      : `<div class="hero reveal"><div class="eyebrow">DSCDA</div><h1>Registry unavailable</h1><p>Could not load "My Systems DSCDA" &rarr; "system sheet" right now${registryError?': '+esc(registryError):''}. Nothing is hard-coded here to fall back on — check the sheet's sharing settings, then retry.</p>
      <div style="text-align:center; margin-top:14px;"><span class="pop-item" id="retryRegistryBtn" style="display:inline-block; cursor:pointer; border:1px solid var(--line); border-radius:8px; padding:8px 16px;">Retry</span></div></div>`;
    const retry = document.getElementById('retryRegistryBtn');
    if(retry) retry.addEventListener('click', ()=>loadRegistry(true));
    updateHeader();
    return;
  }
  const r = state.route;
  let html = '';
  if(r.type==='home') html = viewHome();
  else if(r.type==='area') html = viewArea(r.key);
  else if(r.type==='module') html = viewModule(r.key);
  else if(r.type==='circle') html = viewCircle(r.module, r.circle);
  else if(r.type==='folder') html = viewFolder(r.module, r.circle||null, r.folder);
  else if(r.type==='system') html = viewSystem(r.id);
  else if(r.type==='companywide') html = viewCompanyWide();
  else html = viewHome();
  app.innerHTML = html;
  bindAppEvents();
  updateHeader();
}

function updateHeader(){
  const role = ROLES[state.role];
  document.getElementById('roleLabel').textContent = state.role;
  document.getElementById('avInit').textContent = state.role.slice(0,2);
  document.getElementById('notifDot').style.display = (state.role==='MD'||state.role==='PC') ? 'block' : 'none';
}

/* ---------------------------------------------------------------------
   11. EVENT BINDING
--------------------------------------------------------------------- */
function bindAppEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-nav="area"]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'area', key:el.dataset.key}));
  });
  app.querySelectorAll('[data-nav="module"]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'module', key:el.dataset.key}));
  });
  app.querySelectorAll('[data-nav="circle"]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'circle', module:el.dataset.module, circle:el.dataset.circle}));
  });
  app.querySelectorAll('[data-nav="folder"]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'folder', module:el.dataset.module, circle:el.dataset.circle||null, folder:el.dataset.folder}));
  });
  app.querySelectorAll('[data-nav="companywide"]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'companywide'}));
  });
  app.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>navigate({type:'system', id:el.dataset.open}));
  });
  app.querySelectorAll('[data-crumb]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const route = JSON.parse(el.dataset.crumb);
      navigate(route);
    });
  });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', goBack);

  app.querySelectorAll('.flow-circle[role="button"]').forEach(el=>{
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); }
    });
  });

  app.querySelectorAll('[data-openurl]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const url = el.dataset.openurl;
      if(url) window.open(url, '_blank', 'noopener');
    });
  });
  app.querySelectorAll('[data-fav]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const id = el.dataset.fav;
      if(state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
      render();
    });
  });
}

document.querySelector('.brand').addEventListener('click', ()=>navigate({type:'home'}));
document.getElementById('openSearchBar').addEventListener('click', openSearch);

/* ---------------------------------------------------------------------
   12. GLOBAL SEARCH + COMMAND PALETTE (⌘K)
--------------------------------------------------------------------- */
function openSearch(){
  state.searchOpen = true;
  renderSearchOverlay('');
}
function renderSearchOverlay(query){
  const root = document.getElementById('overlayRoot');
  root.innerHTML = `
    <div class="overlay-bg" id="ovBg">
      <div class="overlay-panel" onclick="event.stopPropagation()">
        <div class="ov-input-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="ovInput" placeholder="Search systems, circles, folders… or type a command" autocomplete="off" value="${esc(query)}"/>
          <span class="esc">ESC</span>
        </div>
        <div class="ov-results" id="ovResults"></div>
      </div>
    </div>`;
  document.getElementById('ovBg').addEventListener('click', closeOverlays);
  const input = document.getElementById('ovInput');
  input.addEventListener('input', ()=>renderSearchResults(input.value));
  input.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeOverlays(); });
  renderSearchResults(query);
  setTimeout(()=>input.focus(), 20);
}
const COMMANDS = [
  {label:'Open Polymer', action:()=>navigate({type:'area', key:'POLYMER'})},
  {label:'Open Textile', action:()=>navigate({type:'area', key:'TEXTILE'})},
  {label:'Open Accounts', action:()=>navigate({type:'module', key:'ACC'})},
  {label:'Open HR', action:()=>navigate({type:'module', key:'HR'})},
  {label:'Open Marketing', action:()=>navigate({type:'module', key:'MKT'})},
  {label:'Open Administration', action:()=>navigate({type:'module', key:'ADM'})},
  {label:'Open Company-Wide & Unmapped', action:()=>navigate({type:'companywide'})},
];
function renderSearchResults(q){
  const el = document.getElementById('ovResults');
  const query = q.trim().toLowerCase();
  if(!query){
    el.innerHTML = `<div class="ov-group-label">Commands</div>` +
      COMMANDS.map((c,i)=>`<div class="ov-row" data-cmd="${i}"><span class="name">${esc(c.label)}</span><span class="sub">↵</span></div>`).join('');
    el.querySelectorAll('[data-cmd]').forEach(r=>r.addEventListener('click', ()=>{ COMMANDS[+r.dataset.cmd].action(); }));
    return;
  }
  const matches = visibleItems().filter(it=>
    (it.name+it.desc+it.dept+(it.circle||'')+it.folder).toLowerCase().includes(query)
  ).slice(0,20);
  const byGroup = {};
  matches.forEach(it=>{ (byGroup[it.typeLabel] = byGroup[it.typeLabel]||[]).push(it); });
  if(matches.length===0){ el.innerHTML = `<div class="ov-empty">No matches for "${esc(q)}". Try another term.</div>`; return; }
  let html = '';
  Object.keys(byGroup).forEach(g=>{
    html += `<div class="ov-group-label">${esc(g)}S</div>`;
    html += byGroup[g].map(it=>`<div class="ov-row" data-open="${it.id}"><span class="name">${esc(it.name)}</span><span class="sub">${esc(it.dept||'')}</span></div>`).join('');
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click', ()=>navigate({type:'system', id:r.dataset.open})));
}
document.addEventListener('keydown', (e)=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
  if(e.key==='Escape') closeOverlays();
});

/* ---------------------------------------------------------------------
   13. PROFILE / ROLE SWITCHER + NOTIFICATIONS
--------------------------------------------------------------------- */
document.getElementById('profileBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const pop = document.getElementById('profilePop');
  if(pop.innerHTML){ pop.innerHTML=''; return; }
  document.getElementById('notifPop').innerHTML='';
  pop.innerHTML = `<div class="pop">
    <div class="pop-label">Switch Role (UI demo — not real security)</div>
    ${Object.keys(ROLES).map(k=>`<div class="pop-item ${k===state.role?'active':''}" data-role="${k}"><span>${ROLES[k].label}</span><span class="tag">${k}</span></div>`).join('')}
    <div class="pop-divider"></div>
    <div class="pop-item" style="opacity:.5; cursor:default;">Administration console — Phase 3</div>
  </div>`;
  pop.querySelectorAll('[data-role]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.role = el.dataset.role;
      state.history = [];
      navigate({type:'home'}, {replace:true});
      pop.innerHTML='';
    });
  });
});
document.getElementById('notifBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  const pop = document.getElementById('notifPop');
  if(pop.innerHTML){ pop.innerHTML=''; return; }
  document.getElementById('profilePop').innerHTML='';
  const unmapped = ITEMS.filter(i=>i.unmapped).length;
  pop.innerHTML = `<div class="pop">
    <div class="pop-label">Notifications</div>
    <div class="pop-item" style="cursor:default;"><span>${unmapped} systems need department configuration</span></div>
    <div class="pop-item" style="cursor:default;"><span id="liveBadgeRow">Registry status: <span id="liveBadge" style="color:var(--ink-faint); font-family:var(--font-mono); font-size:10.5px;">CHECKING…</span></span></div>
    <div class="pop-item" style="cursor:default;"><span id="lastUpdatedRow">Last updated: <span id="lastUpdatedBadge" style="color:var(--ink-faint); font-family:var(--font-mono); font-size:10.5px;">—</span></span></div>
    <div class="pop-divider"></div>
    <div class="pop-item" id="refreshRegistryBtn">Refresh registry now</div>
  </div>`;
  setLiveBadge(liveMode);
  updateLastUpdatedUI();
  document.getElementById('refreshRegistryBtn').addEventListener('click', (ev)=>{
    ev.stopPropagation();
    loadRegistry(true);
  });
});
document.addEventListener('click', ()=>{
  document.getElementById('profilePop').innerHTML='';
  document.getElementById('notifPop').innerHTML='';
});

/* ---------------------------------------------------------------------
   14. INIT
--------------------------------------------------------------------- */
render();
loadRegistry();
</script>
</body>
